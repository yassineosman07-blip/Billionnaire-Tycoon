name: Validate Business Clicker
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    container: swift:6.0.3-jammy@sha256:95f6ef898992dc840b35517e780f6f6db9661432775ab0b33cc0a531ea749bdb
    steps:
      - uses: actions/checkout@v4
      - run: swift test --jobs 4
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(d["udid"] for runtime,ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          mkdir -p Validation
      - name: Compile iOS simulator app
        id: build
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild build -project BusinessClicker.xcodeproj -scheme BusinessClicker -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO 2>&1 | tee Validation/build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          python3 .github/scripts/report-xcode-errors.py Validation/build.log
          exit "$BUILD_STATUS"
      - name: Package compiled simulator app
        if: always() && steps.build.outcome == 'success'
        run: ditto -c -k --keepParent DerivedData/Build/Products/Debug-iphonesimulator/BusinessClicker.app Validation/BusinessClicker-Simulator.zip
      - name: Preserve compiled simulator app
        uses: actions/upload-artifact@v4
        with:
          name: BusinessClicker-Simulator-Intel
          path: Validation/BusinessClicker-Simulator.zip
      - name: Test simulation, persistence and native 3D assets
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild test -project BusinessClicker.xcodeproj -scheme BusinessClicker -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath DerivedData -only-testing:BusinessClickerTests -test-timeouts-enabled YES -default-test-execution-time-allowance 90 -maximum-test-execution-time-allowance 120 -parallel-testing-enabled NO -resultBundlePath Validation/UnitTests.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee Validation/unit-tests.log | python3 -u .github/scripts/stream-xcode-progress.py
          TEST_STATUS=${PIPESTATUS[0]}
          python3 .github/scripts/report-xcode-errors.py Validation/unit-tests.log
          exit "$TEST_STATUS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-and-test-results
          path: Validation/
  ios-ui:
    name: ios-ui-${{ matrix.journey }}
    runs-on: macos-15-intel
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        journey: [testFirstServiceAndPersistence, testShopInteriorAndProductDetails, testThreeActionsPersistAcrossRelaunch]
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(d["udid"] for runtime,ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          mkdir -p Validation
      - name: Test iPhone user journeys
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild test -project BusinessClicker.xcodeproj -scheme BusinessClicker -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath DerivedData -only-testing:BusinessClickerUITests/BusinessClickerUITests/${{ matrix.journey }} -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 -parallel-testing-enabled NO -resultBundlePath Validation/UITests.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee Validation/ui-tests.log | python3 -u .github/scripts/stream-xcode-progress.py
          TEST_STATUS=${PIPESTATUS[0]}
          python3 .github/scripts/report-xcode-errors.py Validation/ui-tests.log
          exit "$TEST_STATUS"
      - name: Export a small native city preview
        if: always() && matrix.journey == 'testFirstServiceAndPersistence'
        continue-on-error: true
        run: |
          xcrun xcresulttool export attachments --path Validation/UITests.xcresult --output-path "$RUNNER_TEMP/city-preview-attachments"
          python3 .github/scripts/export-city-preview.py "$RUNNER_TEMP/city-preview-attachments" Validation/CityPreview.jpg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ui-test-results-${{ matrix.journey }}
          path: Validation/
  city-preview:
    needs: ios-ui
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios-ui-test-results-testFirstServiceAndPersistence
          path: Preview
      - name: Expose the native preview for review
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          encoded=base64.b64encode(Path('Preview/CityPreview.jpg').read_bytes()).decode('ascii')
          parts=[encoded[i:i+3500] for i in range(0,len(encoded),3500)]
          if len(parts)>10:raise SystemExit('Preview exceeds annotation budget')
          for i,part in enumerate(parts,1):
              print(f'::notice title=Native city capture {i}/{len(parts)}::NATIVE_CITY_JPEG_{i}_{len(parts)}:'+part)
          PY
